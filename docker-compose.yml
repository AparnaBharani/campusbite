services:
  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://campus:local-dev-only@db:5432/campus_bite
      REDIS_URL: redis://cache:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: CampusBite <no-reply@campusbite.local>
      APP_ORIGIN: http://localhost:3000
      ALLOWED_STUDENT_DOMAINS: ${ALLOWED_STUDENT_DOMAINS:-cb.students.amrita.edu}
      SESSION_SECRET: local-development-only-change-before-deploying
      ROLE_EMAILS: ${ROLE_EMAILS:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campus_bite
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_bite"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
